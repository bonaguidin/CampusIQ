name: Keep Render backend awake

# Render's free tier spins the backend down after 15 min idle, causing a
# 30-50s cold start on the next request. This pings /health every 10 min
# during business hours to keep it warm, without burning the free-tier
# instance-hour budget by pinging 24/7.
#
# The cron below spans 15:00 UTC -> 00:50 UTC, the union of 10am-6pm Central
# under both CDT (UTC-5) and CST (UTC-6). The window-check step then narrows
# that down to the actual Central local time so DST is handled automatically.
on:
  schedule:
    - cron: "*/10 15-23,0 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check time window (10am-6pm Central)
        id: window
        run: |
          hour=$(TZ='America/Chicago' date +%H)
          hour=$((10#$hour))
          if [ "$hour" -ge 10 ] && [ "$hour" -lt 18 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "Current Central hour is $hour, outside 10am-6pm. Skipping ping."
          fi

      - name: Ping backend health endpoint
        if: steps.window.outputs.in_window == 'true'
        run: curl -fsS --max-time 60 https://campusiq-7rf1.onrender.com/health
